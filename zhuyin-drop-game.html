<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注音接接樂</title>
    <style>:root {
  --bg: #fff8ed;
  --ink: #293241;
  --muted: #6d7482;
  --panel: #fffefa;
  --line: rgba(81, 74, 112, 0.16);
  --sky: #bfeaff;
  --grass: #bdf0a8;
  --coral: #ff7a6b;
  --gold: #f7bd43;
  --mint: #40b89f;
  --blue: #4b8ee8;
  --pink: #ff8bc7;
  --lavender: #a695ff;
  --shadow: rgba(81, 74, 112, 0.18);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 14% 12%, rgba(255, 217, 103, 0.55), transparent 18%),
    radial-gradient(circle at 86% 18%, rgba(255, 139, 199, 0.28), transparent 22%),
    linear-gradient(180deg, #dff6ff 0%, #fff8ed 52%, #ffe9f3 100%);
  font-family:
    "Microsoft JhengHei",
    "Segoe UI",
    system-ui,
    sans-serif;
}

button {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
}

.game-card {
  width: min(1180px, 100%);
  display: grid;
  gap: 14px;
}

.topbar {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) 58px;
  gap: 10px;
  align-items: stretch;
}

.stat,
.icon-btn,
.question-panel {
  border: 2px solid rgba(255, 255, 255, 0.78);
  background: rgba(255, 254, 250, 0.9);
  box-shadow: 0 16px 34px var(--shadow), inset 0 -4px 0 rgba(81, 74, 112, 0.06);
}

.stat {
  min-height: 64px;
  display: grid;
  align-content: center;
  padding: 10px 16px;
  border-radius: 8px;
  background: linear-gradient(180deg, #ffffff, #fff4cf);
}

.stat span,
.eyebrow,
.level-box span {
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.stat strong {
  font-size: 30px;
  line-height: 1;
}

.icon-btn,
#startBtn {
  border-radius: 8px;
  border: 2px solid rgba(255, 255, 255, 0.8);
  color: white;
  background: linear-gradient(180deg, #ff8bc7, #f15a95);
  cursor: pointer;
  box-shadow: inset 0 -4px 0 rgba(41, 50, 65, 0.13);
}

.icon-btn {
  font-size: 30px;
  line-height: 1;
}

.icon-btn:focus-visible,
#startBtn:focus-visible {
  outline: 3px solid rgba(247, 189, 67, 0.9);
  outline-offset: 3px;
}

.play-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 292px;
  gap: 14px;
  align-items: stretch;
}

.playfield-wrap {
  position: relative;
  min-height: 560px;
  overflow: hidden;
  border: 4px solid rgba(255, 255, 255, 0.88);
  border-radius: 8px;
  background:
    radial-gradient(circle at 16% 16%, rgba(255, 230, 97, 0.9), transparent 9%),
    linear-gradient(180deg, var(--sky) 0%, #ecfbff 62%, var(--grass) 63%, #8edb79 100%);
  box-shadow: 0 18px 46px var(--shadow), 0 0 0 3px rgba(255, 139, 199, 0.22);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 560px;
  touch-action: none;
}

.question-panel {
  min-height: 560px;
  border-radius: 8px;
  padding: 16px;
  display: grid;
  grid-template-rows: auto auto minmax(72px, auto) 1fr;
  gap: 14px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 244, 251, 0.92));
}

.prompt-box {
  min-height: 220px;
  border-radius: 8px;
  padding: 18px;
  display: grid;
  align-content: center;
  text-align: center;
  background:
    radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.72), transparent 22%),
    linear-gradient(160deg, #fff2a8, #ffd8ec 54%, #d8f4ff);
  border: 2px dashed rgba(255, 139, 199, 0.7);
}

.zhuyin {
  margin-top: 8px;
  min-height: 118px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 14px;
  font-size: clamp(46px, 7vw, 72px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0;
  color: #5b4ae8;
  text-shadow: 0 4px 0 rgba(255, 255, 255, 0.8);
}

.zhuyin-syllable {
  min-width: 58px;
  min-height: 106px;
  display: grid;
  grid-template-columns: minmax(34px, auto) 28px;
  align-items: center;
  justify-content: center;
  padding: 7px 6px 7px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.46);
  box-shadow: inset 0 -3px 0 rgba(91, 74, 232, 0.08);
}

.zhuyin-body {
  writing-mode: vertical-rl;
  text-orientation: upright;
  line-height: 0.92;
}

.zhuyin-tone {
  min-width: 28px;
  align-self: center;
  font-size: 0.78em;
  line-height: 1;
  color: #e64f96;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
}

.target-hint {
  margin-top: 14px;
  color: #7b5b0a;
  font-weight: 700;
}

.lives {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.lives span {
  min-height: 54px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: linear-gradient(180deg, #ffe6ef, #ffd1e5);
  color: #e33d4f;
  font-size: 34px;
  border: 2px solid rgba(255, 255, 255, 0.75);
}

.lives .lost {
  color: rgba(41, 50, 65, 0.22);
  background: #f0eee8;
}

.feedback,
.level-box {
  border-radius: 8px;
  border: 2px solid rgba(255, 255, 255, 0.75);
  background: #f7fbff;
  box-shadow: inset 0 -3px 0 rgba(81, 74, 112, 0.06);
}

.feedback {
  min-height: 72px;
  display: grid;
  place-items: center;
  padding: 12px;
  text-align: center;
  color: var(--muted);
  font-weight: 800;
}

.feedback.good {
  color: #187e68;
  background: #dff8ef;
}

.feedback.bad {
  color: #b33442;
  background: #ffe5e3;
}

.level-box {
  align-self: end;
  min-height: 74px;
  display: grid;
  align-content: center;
  justify-items: center;
}

.level-box strong {
  font-size: 34px;
  line-height: 1;
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  background: rgba(255, 248, 237, 0.76);
  backdrop-filter: blur(3px);
}

.overlay.hidden {
  display: none;
}

.overlay h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 82px);
  line-height: 1;
}

.overlay p {
  margin: 0;
  color: var(--muted);
  font-size: clamp(17px, 3vw, 24px);
  font-weight: 800;
}

#startBtn {
  justify-self: center;
  min-width: 144px;
  min-height: 54px;
  padding: 0 26px;
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(180deg, #ffbd59, #ff7a6b);
}

@media (max-width: 820px) {
  .app-shell {
    padding: 10px;
    align-items: start;
  }

  .topbar {
    grid-template-columns: repeat(3, minmax(0, 1fr)) 52px;
  }

  .stat {
    padding: 8px 10px;
  }

  .stat strong {
    font-size: 24px;
  }

  .play-layout {
    grid-template-columns: 1fr;
  }

  .question-panel {
    min-height: 0;
    grid-template-columns: 1fr 150px;
    grid-template-rows: auto auto;
  }

  .prompt-box {
    min-height: 132px;
  }

  .lives {
    align-self: stretch;
  }

  .feedback {
    min-height: 58px;
  }

  .level-box {
    min-height: 58px;
  }
}

@media (max-width: 560px) {
  .topbar {
    grid-template-columns: 1fr 1fr;
  }

  .icon-btn {
    grid-column: 2;
    grid-row: 2;
  }

  .playfield-wrap,
  canvas {
    min-height: 430px;
  }

  .question-panel {
    grid-template-columns: 1fr;
  }

  .zhuyin {
    min-height: 96px;
    font-size: 44px;
  }

  .zhuyin-syllable {
    min-height: 88px;
    min-width: 52px;
  }
}
</style>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-card" aria-label="注音接接樂遊戲">
        <div class="topbar">
          <div class="stat">
            <span>分數</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>連對</span>
            <strong id="combo">0</strong>
          </div>
          <div class="stat">
            <span>時間</span>
            <strong id="timeLeft">60</strong>
          </div>
          <button id="restartBtn" class="icon-btn" type="button" aria-label="重新開始" title="重新開始">
            ↻
          </button>
        </div>

        <div class="play-layout">
          <div class="playfield-wrap">
            <canvas id="gameCanvas" width="720" height="820" aria-label="掉落圖片區"></canvas>
            <div id="startOverlay" class="overlay">
              <h1>注音接接樂</h1>
              <p>看右邊注音，點左邊正確圖片。</p>
              <button id="startBtn" type="button">開始</button>
            </div>
          </div>

          <aside class="question-panel" aria-label="目前題目">
            <div class="prompt-box">
              <span class="eyebrow">找這個注音</span>
              <div id="targetZhuyin" class="zhuyin">ㄇㄠ</div>
              <div id="targetHint" class="target-hint">點到對的圖片加分</div>
            </div>

            <div class="lives" aria-label="剩餘愛心">
              <span id="life1">♥</span>
              <span id="life2">♥</span>
              <span id="life3">♥</span>
            </div>

            <div id="feedback" class="feedback">準備好了就開始</div>

            <div class="level-box">
              <span>難度</span>
              <strong id="level">1</strong>
            </div>
          </aside>
        </div>
      </section>
    </main>

const state = {
  running: false,
  score: 0,
  combo: 0,
  lives: 3,
  level: 1,
  target: WORDS[0],
  falling: [],
  lastTime: 0,
  spawnTimer: 0,
  feedbackTimer: 0,
  timeLeft: 180,
  nextQuestionTimer: 0,
};

function choose(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function setFeedback(text, type = "") {
  feedbackEl.textContent = text;
  feedbackEl.className = `feedback ${type}`.trim();
  state.feedbackTimer = 900;
}

function renderZhuyin(zhuyin) {
  const toneMarks = new Set(["\u02ca", "\u02c7", "\u02cb", "\u02d9"]);
  targetEl.textContent = "";

  zhuyin.split(/\s+/).filter(Boolean).forEach((syllable) => {
    const lastChar = syllable.at(-1);
    const hasTone = toneMarks.has(lastChar);
    const bodyText = hasTone ? syllable.slice(0, -1) : syllable;
    const toneText = hasTone ? lastChar : "";
    const group = document.createElement("span");
    const body = document.createElement("span");
    const tone = document.createElement("span");

    group.className = "zhuyin-syllable";
    body.className = "zhuyin-body";
    tone.className = "zhuyin-tone";
    body.textContent = bodyText;
    tone.textContent = toneText;

    group.append(body, tone);
    targetEl.append(group);
  });
}

function pickTarget() {
  state.target = choose(WORDS);
  renderZhuyin(state.target.zhuyin);
  hintEl.textContent = "找出正確圖片";
}

function resetGame() {
  state.running = true;
  state.score = 0;
  state.combo = 0;
  state.lives = 3;
  state.level = 1;
  state.falling = [];
  state.spawnTimer = 0;
  state.feedbackTimer = 0;
  state.timeLeft = 180;
  state.nextQuestionTimer = 0;
  state.lastTime = performance.now();
  pickTarget();
  updateHud();
  setFeedback("看注音，點圖片", "");
  overlayEl.classList.add("hidden");
  requestAnimationFrame(loop);
}

function updateHud() {
  scoreEl.textContent = state.score;
  comboEl.textContent = state.combo;
  timeEl.textContent = Math.max(0, Math.ceil(state.timeLeft));
  levelEl.textContent = state.level;
  lifeEls.forEach((el, index) => {
    el.classList.toggle("lost", index >= state.lives);
  });
}

function endGame(message) {
  state.running = false;
  overlayEl.classList.remove("hidden");
  overlayEl.querySelector("h1").textContent = message;
  overlayEl.querySelector("p").textContent = `得到 ${state.score} 分，按開始再玩一次。`;
  startBtn.textContent = "再玩一次";
}

function spawnItem() {
  const includeTarget = Math.random() < 0.42 || !state.falling.some((item) => item.word.id === state.target.id);
  const word = includeTarget ? state.target : choose(WORDS.filter((item) => item.id !== state.target.id));
  const radius = Math.max(54, Math.min(76, canvas.width * 0.09));
  const x = radius + Math.random() * (canvas.width - radius * 2);
  const speed = 58 + state.level * 10 + Math.random() * 24;
  state.falling.push({
    word,
    x,
    y: -radius - 8,
    radius,
    speed,
    wobble: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.8,
    rotation: 0,
  });
}

function answer(item) {
  if (!state.running) return;

  if (item.word.id === state.target.id) {
    state.score += 10 + Math.min(20, state.combo * 2);
    state.combo += 1;
    state.level = 1 + Math.floor(state.score / 90);
    setFeedback(`答對了：${item.word.label}`, "good");
    beep(560, 0.08, "sine");
    state.falling = state.falling.filter((candidate) => candidate !== item);
    state.nextQuestionTimer = 260;
    return;
  }

  state.combo = 0;
  state.lives -= 1;
  setFeedback(`這是「${item.word.label}」`, "bad");
  beep(170, 0.12, "triangle");
  state.falling = state.falling.filter((candidate) => candidate !== item);
  if (state.lives <= 0) endGame("再練一次");
}

function missTarget(item) {
  state.combo = 0;
  state.lives -= 1;
  setFeedback(`漏掉了：${item.word.label}`, "bad");
  beep(130, 0.12, "sawtooth");
  if (state.lives <= 0) endGame("再練一次");
}

function update(delta) {
  state.timeLeft -= delta / 1000;
  if (state.timeLeft <= 0) {
    endGame("時間到");
    return;
  }

  state.spawnTimer -= delta;
  state.feedbackTimer -= delta;
  state.nextQuestionTimer -= delta;

  if (state.feedbackTimer <= 0 && state.running) {
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "看右邊注音";
  }

  if (state.nextQuestionTimer <= 0 && state.nextQuestionTimer > -delta) {
    pickTarget();
  }

  const spawnEvery = Math.max(850, 1500 - state.level * 55);
  if (state.spawnTimer <= 0) {
    spawnItem();
    state.spawnTimer = spawnEvery;
  }

  for (const item of state.falling) {
    item.y += item.speed * (delta / 1000);
    item.wobble += delta / 700;
    item.rotation += item.spin * (delta / 1000);
  }

  const bottom = canvas.height + 70;
  const missed = state.falling.filter((item) => item.y - item.radius > bottom);
  state.falling = state.falling.filter((item) => item.y - item.radius <= bottom);
  missed.forEach((item) => {
    if (item.word.id === state.target.id && state.running) missTarget(item);
  });

  updateHud();
}

function loop(now) {
  if (!state.running) return;
  const delta = Math.min(40, now - state.lastTime);
  state.lastTime = now;
  update(delta);
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawScenery();
  for (const item of state.falling) {
    drawToken(item);
  }
}

function drawScenery() {
  ctx.save();
  drawSun();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = "#ffffff";
  drawCloud(122, 92, 1.2);
  drawCloud(540, 150, 0.9);
  drawCloud(330, 56, 0.75);
  ctx.restore();

  ctx.save();
  ctx.fillStyle = "rgba(41, 50, 65, 0.08)";
  for (let i = 0; i < 7; i += 1) {
    const x = 48 + i * 104;
    ctx.beginPath();
    ctx.moveTo(x, canvas.height - 120);
    ctx.quadraticCurveTo(x + 38, canvas.height - 176, x + 82, canvas.height - 120);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  drawGroundFlowers();
}

function drawSun() {
  ctx.fillStyle = "#ffe166";
  ctx.beginPath();
  ctx.arc(86, 84, 42, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 189, 89, 0.8)";
  ctx.lineWidth = 5;
  for (let i = 0; i < 10; i += 1) {
    const angle = (Math.PI * 2 * i) / 10;
    ctx.beginPath();
    ctx.moveTo(86 + Math.cos(angle) * 55, 84 + Math.sin(angle) * 55);
    ctx.lineTo(86 + Math.cos(angle) * 68, 84 + Math.sin(angle) * 68);
    ctx.stroke();
  }
}

function drawCloud(x, y, scale) {
  ctx.beginPath();
  ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
  ctx.arc(x + 24 * scale, y - 12 * scale, 25 * scale, 0, Math.PI * 2);
  ctx.arc(x + 52 * scale, y, 22 * scale, 0, Math.PI * 2);
  ctx.rect(x - 4 * scale, y, 62 * scale, 18 * scale);
  ctx.fill();
}

function drawGroundFlowers() {
  const baseY = canvas.height - 58;
  const colors = ["#ff8bc7", "#ffbd59", "#7f73d9", "#40b89f", "#ff7a6b"];
  for (let i = 0; i < 11; i += 1) {
    const x = 34 + i * 66;
    const y = baseY + Math.sin(i) * 9;
    ctx.strokeStyle = "#4c9a5d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y + 18);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.fillStyle = colors[i % colors.length];
    for (let petal = 0; petal < 5; petal += 1) {
      const angle = (Math.PI * 2 * petal) / 5;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(angle) * 8, y + Math.sin(angle) * 8, 6, 8, angle, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#fff2a8";
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawToken(item) {
  const bob = Math.sin(item.wobble) * 7;
  ctx.save();
  ctx.translate(item.x, item.y + bob);
  ctx.rotate(item.rotation);
  ctx.shadowColor = "rgba(41, 50, 65, 0.22)";
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 12;
  ctx.fillStyle = "#fffefa";
  ctx.beginPath();
  ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 139, 199, 0.58)";
  ctx.lineWidth = Math.max(4, item.radius * 0.08);
  ctx.stroke();
  ctx.shadowColor = "transparent";
  drawPicture(item.word, item.radius);
  ctx.restore();
}

function drawPicture(word, r) {
  const asset = assetImages.get(word.id);
  if (asset?.complete && asset.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(asset, -r * 0.75, -r * 0.75, r * 1.5, r * 1.5);
    ctx.restore();
    return;
  }

  ctx.lineWidth = Math.max(3, r * 0.07);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const drawers = {
    cat: drawCat,
    dog: drawDog,
    fish: drawFish,
    flower: drawFlower,
    car: drawCar,
    moon: drawMoon,
    ball: drawBall,
    bird: drawBird,
    mountain: drawMountain,
    rain: drawRain,
    fire: drawFire,
    book: drawBook,
    hand: drawHand,
    mouth: drawMouth,
    ear: drawEar,
    eye: drawEye,
  };

  if (drawers[word.id]) {
    drawers[word.id](word.color, r);
    return;
  }

  drawGenericPicture(word, r);
}

function drawGenericPicture(word, r) {
  ctx.fillStyle = word.color;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.font = `900 ${Math.max(22, r * 0.38)}px "Microsoft JhengHei", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(word.label.slice(0, 1), 0, 1);
}

function drawCat(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-r * 0.45, -r * 0.15);
  ctx.lineTo(-r * 0.3, -r * 0.52);
  ctx.lineTo(-r * 0.05, -r * 0.28);
  ctx.lineTo(r * 0.22, -r * 0.52);
  ctx.lineTo(r * 0.4, -r * 0.12);
  ctx.arc(0, 0, r * 0.42, 0, Math.PI * 2);
  ctx.fill();
  face();
}

function drawDog(color, r) {
  ctx.fillStyle = color;
  rounded(-r * 0.45, -r * 0.32, r * 0.9, r * 0.72, r * 0.2);
  ctx.fill();
  ctx.fillStyle = "#8b5d38";
  rounded(-r * 0.58, -r * 0.25, r * 0.22, r * 0.46, r * 0.12);
  rounded(r * 0.36, -r * 0.25, r * 0.22, r * 0.46, r * 0.12);
  ctx.fill();
  face();
}

function drawFish(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(-r * 0.06, 0, r * 0.48, r * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.36, 0);
  ctx.lineTo(r * 0.68, -r * 0.26);
  ctx.lineTo(r * 0.68, r * 0.26);
  ctx.closePath();
  ctx.fill();
  eye(-r * 0.24, -r * 0.07, r);
}

function drawFlower(color, r) {
  ctx.fillStyle = color;
  for (let i = 0; i < 6; i += 1) {
    ctx.save();
    ctx.rotate((Math.PI * 2 * i) / 6);
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.28, r * 0.18, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = "#f7bd43";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
  ctx.fill();
}

function drawCar(color, r) {
  ctx.fillStyle = color;
  rounded(-r * 0.58, -r * 0.12, r * 1.16, r * 0.42, r * 0.12);
  rounded(-r * 0.28, -r * 0.36, r * 0.56, r * 0.3, r * 0.08);
  ctx.fill();
  wheel(-r * 0.32, r * 0.32, r);
  wheel(r * 0.32, r * 0.32, r);
}

function drawMoon(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(-r * 0.05, 0, r * 0.46, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fffefa";
  ctx.beginPath();
  ctx.arc(r * 0.14, -r * 0.09, r * 0.45, 0, Math.PI * 2);
  ctx.fill();
}

function drawBall(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fffefa";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.48, -0.7, 0.7);
  ctx.moveTo(0, -r * 0.48);
  ctx.lineTo(0, r * 0.48);
  ctx.moveTo(-r * 0.48, 0);
  ctx.lineTo(r * 0.48, 0);
  ctx.stroke();
}

function drawBird(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, r * 0.05, r * 0.42, r * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.35, 0);
  ctx.lineTo(r * 0.65, -r * 0.1);
  ctx.lineTo(r * 0.35, -r * 0.22);
  ctx.closePath();
  ctx.fillStyle = "#f7bd43";
  ctx.fill();
  eye(-r * 0.16, -r * 0.08, r);
}

function drawMountain(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-r * 0.65, r * 0.42);
  ctx.lineTo(-r * 0.18, -r * 0.45);
  ctx.lineTo(r * 0.12, r * 0.08);
  ctx.lineTo(r * 0.34, -r * 0.28);
  ctx.lineTo(r * 0.66, r * 0.42);
  ctx.closePath();
  ctx.fill();
}

function drawRain(color, r) {
  ctx.fillStyle = "#bde8ff";
  drawCloud(-r * 0.36, -r * 0.34, 0.48);
  ctx.strokeStyle = color;
  for (let i = 0; i < 4; i += 1) {
    const x = -r * 0.36 + i * r * 0.24;
    ctx.beginPath();
    ctx.moveTo(x, r * 0.02);
    ctx.lineTo(x - r * 0.12, r * 0.34);
    ctx.stroke();
  }
}

function drawFire(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.58);
  ctx.bezierCurveTo(r * 0.5, -r * 0.15, r * 0.36, r * 0.48, 0, r * 0.54);
  ctx.bezierCurveTo(-r * 0.42, r * 0.38, -r * 0.52, -r * 0.12, 0, -r * 0.58);
  ctx.fill();
  ctx.fillStyle = "#ffe071";
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.22);
  ctx.bezierCurveTo(r * 0.22, r * 0.08, r * 0.14, r * 0.34, 0, r * 0.38);
  ctx.bezierCurveTo(-r * 0.2, r * 0.24, -r * 0.2, 0, 0, -r * 0.22);
  ctx.fill();
}

function drawBook(color, r) {
  ctx.fillStyle = color;
  rounded(-r * 0.5, -r * 0.42, r * 0.44, r * 0.78, r * 0.08);
  rounded(r * 0.06, -r * 0.42, r * 0.44, r * 0.78, r * 0.08);
  ctx.fill();
  ctx.strokeStyle = "#fffefa";
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.38);
  ctx.lineTo(0, r * 0.34);
  ctx.stroke();
}

function drawHand(color, r) {
  ctx.fillStyle = color;
  rounded(-r * 0.24, -r * 0.12, r * 0.5, r * 0.56, r * 0.18);
  for (let i = 0; i < 4; i += 1) {
    rounded(-r * 0.38 + i * r * 0.18, -r * 0.42, r * 0.14, r * 0.38, r * 0.07);
  }
  ctx.fill();
}

function drawMouth(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.5, r * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fffefa";
  ctx.beginPath();
  ctx.ellipse(0, -r * 0.06, r * 0.36, r * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawEar(color, r) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.35, r * 0.52, 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#bf795d";
  ctx.beginPath();
  ctx.arc(0, r * 0.02, r * 0.2, -1.2, 1.4);
  ctx.stroke();
}

function drawEye(color, r) {
  ctx.fillStyle = "#fffefa";
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.54, r * 0.31, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
  ctx.fill();
}

function face() {
  eye(-12, -4, 48);
  eye(12, -4, 48);
  ctx.strokeStyle = "#293241";
  ctx.beginPath();
  ctx.arc(0, 9, 11, 0.1, Math.PI - 0.1);
  ctx.stroke();
}

function eye(x, y, r) {
  ctx.fillStyle = "#293241";
  ctx.beginPath();
  ctx.arc(x, y, Math.max(3, r * 0.055), 0, Math.PI * 2);
  ctx.fill();
}

function wheel(x, y, r) {
  ctx.fillStyle = "#293241";
  ctx.beginPath();
  ctx.arc(x, y, r * 0.12, 0, Math.PI * 2);
  ctx.fill();
}

function rounded(x, y, width, height, radius) {
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, radius);
}

function handlePointer(event) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (event.clientX - rect.left) * scaleX;
  const y = (event.clientY - rect.top) * scaleY;

  for (let i = state.falling.length - 1; i >= 0; i -= 1) {
    const item = state.falling[i];
    const distance = Math.hypot(x - item.x, y - item.y);
    if (distance <= item.radius * 1.08) {
      answer(item);
      updateHud();
      break;
    }
  }
}

let audioContext;
function beep(frequency, duration, type) {
  try {
    audioContext ||= new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0.06, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
    oscillator.connect(gain).connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch {
    // Audio is optional; some browsers block it until the first user gesture.
  }
}

canvas.addEventListener("pointerdown", handlePointer);
startBtn.addEventListener("click", resetGame);
restartBtn.addEventListener("click", resetGame);

pickTarget();
updateHud();
draw();
</script>
